        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body {
            font-family: 'Nunito', 'Comic Sans MS', sans-serif;
            background-color: #e0f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Container exactly matched to reference dimensions and responsive behavior */
        .game-container {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 35px;
            border: 5px solid #93c5fd;
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.25);
            width: 100%;
            max-width: 520px;
            text-align: center;
            position: relative;
            z-index: 10;
            max-height: 98vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* Monster Animations */
        @keyframes chomp {
            0% { transform: scale(1); }
            50% { transform: scale(1.25) rotate(-5deg); }
            100% { transform: scale(1); }
        }
        .animate-chomp {
            animation: chomp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Letter Tile Error Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Star Stamp Animation */
        @keyframes stamp {
            0% { transform: scale(5) rotate(45deg); opacity: 0; }
            50% { transform: scale(0.8) rotate(-10deg); opacity: 1; }
            70% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-stamp {
            animation: stamp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Letter Tile Styles */
        .letter-tile {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: grab;
            will-change: transform;
        }
        .letter-tile:active {
            cursor: grabbing;
        }

        /* Blanks Style */
        .blank-slot {
            transition: all 0.3s ease;
        }
        .blank-slot.filled {
            border-bottom-color: transparent;
            color: #1e3a8a;
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <script>
      (function () {
        const GAME_ID = "p5_5a1_4_spelling";
        const EXP_PER_CORRECT = 5;
        const COMPLETION_BONUS_EXP = 20;
        const USER_STORAGE_KEY = "p5_current_user";
        const SCHOOL_YEAR_KEY = "p5_exp_school_year";
        const PROFILES_COLLECTION = "2627p5_user_profiles";

        function getCurrentSchoolYearKey(dateObj = new Date()) {
          const year = dateObj.getFullYear();
          const month = dateObj.getMonth() + 1;
          const startYear = month >= 9 ? year : year - 1;
          const endYear = startYear + 1;
          return `${String(startYear).slice(-2)}${String(endYear).slice(-2)}`;
        }

        function ensureSchoolYearLocal() {
          const currentSY = getCurrentSchoolYearKey();
          const savedSY = localStorage.getItem(SCHOOL_YEAR_KEY);
          if (savedSY !== currentSY) {
            ["p5_prepositions", "p5_adj_adv", "p5_tenses", "p5_irregular_verbs", "p5_5a1_4_spelling"].forEach((gid) => {
              localStorage.setItem(`p5_exp_${gid}`, "0");
            });
            localStorage.setItem("p5_streak_count", "0");
            localStorage.setItem("p5_streak_last_date", "");
            localStorage.setItem(SCHOOL_YEAR_KEY, currentSY);
          }
          return currentSY;
        }

        function getSavedHubUser() {
          try {
            const raw = localStorage.getItem(USER_STORAGE_KEY);
            if (!raw) return null;
            const u = JSON.parse(raw);
            if (!u || !u.id) return null;
            return {
              id: String(u.id),
              lastName: u.lastName || "Student",
              class: u.class || "5A",
              studentNum: u.studentNum ? parseInt(u.studentNum, 10) : ""
            };
          } catch (_) {
            return null;
          }
        }

        window.persistHubUser = function (partialUser) {
          try {
            const existing = getSavedHubUser() || {};
            const merged = {
              id: String((partialUser && partialUser.id) || existing.id || ""),
              lastName: (partialUser && partialUser.lastName) || existing.lastName || "Student",
              class: (partialUser && partialUser.class) || existing.class || "5A",
              studentNum:
                partialUser && partialUser.studentNum
                  ? parseInt(partialUser.studentNum, 10)
                  : (existing.studentNum || "")
            };
            if (!merged.id) return null;
            localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(merged));
            window.currentUser = merged;
            return merged;
          } catch (_) {
            return null;
          }
        };

        function applyInheritedUserUI() {
          const u = getSavedHubUser();
          if (!u) return;
          window.currentUser = u;

          const btnCont = document.getElementById("google-btn-container");
          if (btnCont) btnCont.style.display = "none";
          const hintEl = document.getElementById("login-hint");
          if (hintEl) hintEl.style.display = "none";

          const welcomeEl = document.getElementById("user-welcome");
          if (welcomeEl) {
            const tag = u.class ? ` (${u.class}${u.studentNum ? " #" + u.studentNum : ""})` : "";
            welcomeEl.innerText = `✅ Signed in: ${u.lastName}${tag}`;
            welcomeEl.style.display = "block";
            welcomeEl.classList.remove("hidden");
          }

          const clsSelect = document.getElementById("class-select");
          if (clsSelect && u.class) clsSelect.value = u.class;
          const numInput = document.getElementById("student-num");
          if (numInput && u.studentNum) numInput.value = u.studentNum;
        }

        window.syncP5HomeStats = function (newScore, earnedExp) {
          try {
            const sy = ensureSchoolYearLocal();
            const s = Math.max(0, Math.round(Number(newScore) || 0));
            const e = Math.max(0, Math.round(Number(earnedExp) || 0));

            const prevBest = parseInt(localStorage.getItem(`p5_highscore_${GAME_ID}`) || "0", 10) || 0;
            const bestNow = Math.max(prevBest, s);
            localStorage.setItem(`p5_highscore_${GAME_ID}`, String(bestNow));

            const prevExp = parseInt(localStorage.getItem(`p5_exp_${GAME_ID}`) || "0", 10) || 0;
            const expNow = prevExp + e;
            localStorage.setItem(`p5_exp_${GAME_ID}`, String(expNow));

            if (typeof window.pushGameStatsToCloudProfile === "function") {
              window.pushGameStatsToCloudProfile(GAME_ID, bestNow, expNow, sy);
            }
          } catch (err) {
            console.warn("Home sync error:", err);
          }
        };

        window.awardCorrectExp = function (scoreForBest) {
          window.syncP5HomeStats(scoreForBest, EXP_PER_CORRECT);
        };

        window.awardRoundCompletionExp = function (scoreForBest) {
          window.syncP5HomeStats(scoreForBest, COMPLETION_BONUS_EXP);
        };

        // Hook into existing handleCredentialResponse if present so sign-in automatically saves class/num/user
        const origHandleCred = window.handleCredentialResponse;
        window.handleCredentialResponse = function (response) {
          if (typeof origHandleCred === "function") {
            origHandleCred(response);
          }
          if (window.currentUser && window.currentUser.id) {
            const saved = window.persistHubUser(window.currentUser);
            if (saved && typeof window.pullCloudProfileToGame === "function") {
              window.pullCloudProfileToGame(saved);
            }
          }
        };

        document.addEventListener("DOMContentLoaded", function () {
          ensureSchoolYearLocal();
          applyInheritedUserUI();
          const u = getSavedHubUser();
          if (u && typeof window.pullCloudProfileToGame === "function") {
            window.pullCloudProfileToGame(u);
          }
        });

        window.addEventListener("load", function () {
          ensureSchoolYearLocal();
          applyInheritedUserUI();
        });
      })();
    </script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
      import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDUODAImoAOc-o9sgOrhOYz1kImZcg3cqI",
        authDomain: "test-7f93c.firebaseapp.com",
        projectId: "test-7f93c",
        storageBucket: "test-7f93c.firebasestorage.app",
        messagingSenderId: "623171860819",
        appId: "1:623171860819:web:587304c09b0e8bfcebc9a6",
        measurementId: "G-S68W1EQDYS"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const PROFILES_COLLECTION = "2627p5_user_profiles";

      function getSchoolYearKey() {
        const d = new Date();
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        const start = m >= 9 ? y : y - 1;
        return `${String(start).slice(-2)}${String(start + 1).slice(-2)}`;
      }

      window.pullCloudProfileToGame = async function (userObj) {
        const u = userObj || window.currentUser;
        if (!u || !u.id) return;
        const sy = getSchoolYearKey();
        try {
          const ref = doc(db, PROFILES_COLLECTION, String(u.id));
          const snap = await getDoc(ref);
          if (!snap.exists()) return;
          const cloud = snap.data() || {};
          const merged = window.persistHubUser({
            id: String(u.id),
            lastName: cloud.lastName || u.lastName || "Student",
            class: u.class || cloud.class || "5A",
            studentNum: u.studentNum || cloud.studentNum || ""
          });
          const games = cloud.games || {};
          ["p5_prepositions", "p5_adj_adv", "p5_tenses", "p5_irregular_verbs", "p5_5a1_4_spelling"].forEach((gid) => {
            const localHS = parseInt(localStorage.getItem(`p5_highscore_${gid}`) || "0", 10) || 0;
            const cloudHS = parseInt((games[gid] && games[gid].highScore) || 0, 10) || 0;
            localStorage.setItem(`p5_highscore_${gid}`, String(Math.max(localHS, cloudHS)));

            const localExp = parseInt(localStorage.getItem(`p5_exp_${gid}`) || "0", 10) || 0;
            const cloudExp = cloud.expSchoolYear === sy ? (parseInt((games[gid] && games[gid].exp) || 0, 10) || 0) : 0;
            localStorage.setItem(`p5_exp_${gid}`, String(Math.max(localExp, cloudExp)));
          });
          if (merged) {
            const clsSelect = document.getElementById("class-select");
            if (clsSelect && merged.class) clsSelect.value = merged.class;
            const numInput = document.getElementById("student-num");
            if (numInput && merged.studentNum) numInput.value = merged.studentNum;
          }
        } catch (e) {
          console.warn("Pull profile failed:", e);
        }
      };

      window.pushGameStatsToCloudProfile = async function (gameId, bestScore, gameExp, schoolYear) {
        const u = window.currentUser;
        if (!u || !u.id) return;
        const sy = schoolYear || getSchoolYearKey();
        try {
          const ref = doc(db, PROFILES_COLLECTION, String(u.id));
          const payload = {
            googleId: String(u.id),
            lastName: u.lastName || "Student",
            class: u.class || "5A",
            studentNum: u.studentNum ? parseInt(u.studentNum, 10) : null,
            expSchoolYear: sy,
            games: {
              [gameId]: {
                highScore: Math.max(0, Number(bestScore) || 0),
                exp: Math.max(0, Number(gameExp) || 0)
              }
            },
            updatedAt: new Date().toISOString()
          };
          await setDoc(ref, payload, { merge: true });
        } catch (e) {
          console.warn("Push profile failed:", e);
        }
      };
    </script>

    <script>
        let currentUser = null; 

        function parseJwt(token) {
            try {
                return JSON.parse(decodeURIComponent(window.atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join('')));
            } catch (e) { return null; }
        }

        function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);
            if (payload) {
                currentUser = { 
                    id: payload.sub, 
                    lastName: payload.family_name || payload.name || "Student" 
                };
                document.getElementById('google-btn-container').style.display = 'none';
                const welcomeEl = document.getElementById('user-welcome');
                welcomeEl.innerText = `👋 Hi, ${currentUser.lastName}!`;
                welcomeEl.classList.remove('hidden');
            }
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "623171860819-1fldq3op0pmilgapk5o2j9c3f8oa7d39.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("google-btn-container"),
                { theme: "outline", size: "small", shape: "pill" }
            );
            initGame();
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUODAImoAOc-o9sgOrhOYz1kImZcg3cqI",
            authDomain: "test-7f93c.firebaseapp.com",
            projectId: "test-7f93c",
            storageBucket: "test-7f93c.firebasestorage.app",
            messagingSenderId: "623171860819",
            appId: "1:623171860819:web:587304c09b0e8bfcebc9a6",
            measurementId: "G-S68W1EQDYS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveToFirebase = async (data) => {
            const btn = document.getElementById('btn-save-score');
            try {
                btn.innerText = "Transmitting... 📡";
                btn.disabled = true;
                
                const docId = `${data.googleId}_timed_${data.chapter}`;
                const docRef = doc(db, "2627p5a1_spelling_monster", docId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && data.score <= docSnap.data().score) {
                    alert(`Your high score in this chapter is ${docSnap.data().score}. Keep trying to beat your record! 💪`);
                    btn.innerText = "Submit Score 🚀";
                    btn.disabled = false;
                    return;
                }

                await setDoc(docRef, { ...data, timestamp: new Date() });
                alert("New High Score saved to Hall of Fame! 🎉");
                document.getElementById('game-over-modal').classList.add('hidden');
                document.getElementById('hof-modal').classList.remove('hidden');
                fetchLeaderboard();
            } catch (e) {
                console.error("Firebase Error:", e);
                alert("Upload failed. Please check your network connection.");
            } finally {
                btn.innerText = "Submit Score 🚀";
                btn.disabled = false;
            }
        };

        window.fetchLeaderboard = async () => {
            const tbody = document.getElementById('hof-table-body');
            tbody.innerHTML = "<tr><td colspan='5' class='p-3 text-center text-xs'>Loading leaderboard... ⏳</td></tr>";
            
            const classFilter = document.getElementById('filter-class').value;
            const chapterFilter = document.getElementById('filter-chapter') ? document.getElementById('filter-chapter').value : 'all';
            
            let conds = [];
            if (chapterFilter) {
                conds.push(where("chapter", "==", chapterFilter));
            }
            
            if (classFilter !== "ALL") {
                conds.push(where("class", "==", classFilter));
            }

            try {
                const q = query(collection(db, "2627p5a1_spelling_monster"), ...conds, orderBy("score", "desc"), limit(25));
                const snap = await getDocs(q);
                tbody.innerHTML = snap.empty ? "<tr><td colspan='5' class='p-3 text-center text-gray-400 text-xs'>No scores logged yet!</td></tr>" : "";
                
                let rank = 1;
                snap.forEach((docSnap) => {
                    const d = docSnap.data();
                    let rDisp = rank === 1 ? "🥇 1" : rank === 2 ? "🥈 2" : rank === 3 ? "🥉 3" : rank;
                    tbody.innerHTML += `
                        <tr class="hover:bg-yellow-50">
                            <td class="p-1.5 text-center font-black">${rDisp}</td>
                            <td class="p-1.5">${d.class}</td>
                            <td class="p-1.5 text-center">${d.studentNum}</td>
                            <td class="p-1.5 font-bold text-blue-700">${d.lastName || d.name || 'Student'}</td>
                            <td class="p-1.5 text-center font-black text-yellow-600">${d.score}</td>
                        </tr>`;
                    rank++;
                });
            } catch (e) {
                console.error("Error fetching leaderboard:", e);
                tbody.innerHTML = `<tr><td colspan='5' class='p-3 text-center text-red-500 text-xs'>Failed to load data. Firestore index may be missing. Check browser console (F12) for index link.</td></tr>`;
            }
        };
    </script>

    <!-- Game Logic & Vocabulary Dataset -->
    <script>
        const vocabularyBank = {
            '1': [
                "arrive", "early", "late", "dress", "tidily", "untidily", "wait", 
                "patiently", "impatiently", "eat", "quietly", "noisily", "speak", 
                "politely", "rudely", "jump", "queue", "offer", "seat", "push", 
                "passengers", "rush", "seats", "talk", "phone", "softly", "loudly"
            ],
            '2': [
                "mean", "nice", "say", "sorry", "share", "feelings", "secrets", 
                "quarrel", "argue", "discuss", "agree", "disagree", "get", "help", 
                "homework", "lie", "jealous", "take", "care", "shocked", "puzzled", 
                "embarrassed", "annoyed", "upset", "disappointed"
            ],
            '3': [
                "vest", "bow", "tie", "suit", "sandals", "gloves", "mittens", 
                "glasses", "sunglasses", "curly", "blonde", "hair", "long", 
                "straight", "round", "face"
            ],
            '4': [
                "backpack", "hairbrush", "racket", "hair", "clip", "mirror", 
                "goggles", "headphones", "gold", "necklace", "diamond", "ring", 
                "crystal", "bracelet", "silver", "earrings", "woollen", "cardigan", 
                "cotton", "top", "leather", "coin", "purse"
            ]
        };
        vocabularyBank['all'] = [...vocabularyBank['1'], ...vocabularyBank['2'], ...vocabularyBank['3'], ...vocabularyBank['4']];

        // Game State
        let currentChapter = 'all';
        let gameMode = 'timed';
        let currentWord = '';
        let targetIndex = 0;
        let wordsCompleted = 0;
        let timerInterval = null;
        let timeLeft = 180;

        // Drag State
        let activeTile = null;
        let startX = 0, startY = 0;

        // DOM Elements
        const monsterZone = document.getElementById('monster-zone');
        const blanksContainer = document.getElementById('blanks-container');
        const lettersContainer = document.getElementById('letters-container');
        const audioBtn = document.getElementById('btn-audio');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const timerBox = document.getElementById('timer-box');
        const chapterSelect = document.getElementById('chapter-select');
        const modeBtn = document.getElementById('btn-mode');
        const hofBtn = document.getElementById('btn-hof');

        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreDisplay = document.getElementById('final-score');
        const hofModal = document.getElementById('hof-modal');
        const closeHofBtn = document.getElementById('btn-close-hof');

        // Web Audio Synthesizer (Sound FX)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'tada') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        function initGame() {
            wordsCompleted = 0;
            scoreDisplay.textContent = wordsCompleted;
            setupTimer();
            loadNextWord();
            setupEventListeners();
        }

        function setupTimer() {
            clearInterval(timerInterval);
            if (gameMode === 'timed') {
                timeLeft = 180;
                timerBox.classList.remove('hidden');
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        endGame();
                    }
                }, 1000);
            } else {
                timerBox.classList.add('hidden');
            }
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function endGame() {
            if (window.awardRoundCompletionExp) window.awardRoundCompletionExp(wordsCompleted);
            finalScoreDisplay.textContent = wordsCompleted;
            if (currentUser) {
                document.getElementById('upload-name-display').innerText = currentUser.lastName;
                document.getElementById('upload-section').classList.remove('hidden');
            } else {
                document.getElementById('upload-section').classList.add('hidden');
            }
            gameOverModal.classList.remove('hidden');
        }

        function restartGame() {
            gameOverModal.classList.add('hidden');
            initGame();
        }

        function loadNextWord() {
            const list = vocabularyBank[currentChapter];
            currentWord = list[Math.floor(Math.random() * list.length)];
            targetIndex = 0;
            
            blanksContainer.innerHTML = '';
            for (let i = 0; i < currentWord.length; i++) {
                const blank = document.createElement('div');
                blank.className = 'blank-slot w-7 h-9 sm:w-9 sm:h-11 border-b-4 sm:border-b-6 border-blue-400 flex items-end justify-center pb-1 text-xl sm:text-2xl font-black text-transparent lowercase';
                blank.textContent = currentWord[i];
                blanksContainer.appendChild(blank);
            }

            lettersContainer.innerHTML = '';
            const scrambled = currentWord.split('').sort(() => Math.random() - 0.5);
            scrambled.forEach((letter) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile bg-yellow-300 border-3 sm:border-4 border-yellow-500 rounded-xl w-10 h-12 sm:w-11 sm:h-13 flex items-center justify-center text-xl sm:text-2xl font-black text-blue-900 lowercase shadow-md';
                tile.textContent = letter;
                tile.dataset.letter = letter;
                tile.addEventListener('pointerdown', handleDragStart);
                lettersContainer.appendChild(tile);
            });

            setTimeout(playAudio, 400);
        }

        function playAudio() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(currentWord);
                utterance.lang = 'en-GB';
                utterance.rate = 0.85;

                const voices = window.speechSynthesis.getVoices();
                const ukVoice = voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB' || v.name.includes('UK'));
                if (ukVoice) utterance.voice = ukVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        function handleDragStart(e) {
            activeTile = e.target;
            startX = e.clientX;
            startY = e.clientY;
            
            activeTile.style.transition = 'none';
            activeTile.style.zIndex = '50';
            activeTile.classList.add('shadow-2xl', 'scale-110');
            
            activeTile.setPointerCapture(e.pointerId);
            activeTile.addEventListener('pointermove', handleDragMove);
            activeTile.addEventListener('pointerup', handleDragEnd);
            activeTile.addEventListener('pointercancel', handleDragEnd);
        }

        function handleDragMove(e) {
            if (!activeTile) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            activeTile.style.transform = `translate(${dx}px, ${dy}px) scale(1.1)`;
        }

        function handleDragEnd(e) {
            if (!activeTile) return;
            activeTile.removeEventListener('pointermove', handleDragMove);
            activeTile.removeEventListener('pointerup', handleDragEnd);
            activeTile.removeEventListener('pointercancel', handleDragEnd);
            activeTile.releasePointerCapture(e.pointerId);

            checkDropTarget();
            activeTile = null;
        }

        function checkDropTarget() {
            const monsterRect = monsterZone.getBoundingClientRect();
            const tileRect = activeTile.getBoundingClientRect();

            const isIntersecting = !(
                tileRect.right < monsterRect.left - 20 ||
                tileRect.left > monsterRect.right + 20 ||
                tileRect.bottom < monsterRect.top - 20 ||
                tileRect.top > monsterRect.bottom + 20
            );

            if (isIntersecting) {
                if (activeTile.dataset.letter === currentWord[targetIndex]) {
                    handleCorrectLetter();
                } else {
                    handleIncorrectLetter();
                }
            } else {
                resetTilePosition();
            }
        }

        function handleCorrectLetter() {
            playSound('correct');
            monsterZone.classList.remove('animate-chomp');
            void monsterZone.offsetWidth;
            monsterZone.classList.add('animate-chomp');

            blanksContainer.children[targetIndex].classList.add('filled');
            activeTile.style.display = 'none';
            targetIndex++;

            if (targetIndex === currentWord.length) {
                wordsCompleted++;
                scoreDisplay.textContent = wordsCompleted;
                if (window.awardCorrectExp) window.awardCorrectExp(mode === 'timed' ? stats.score : stats.correct * 10);
                playSound('tada');
                setTimeout(loadNextWord, 1200);
            }
        }

        function handleIncorrectLetter() {
            playSound('wrong');
            monsterZone.classList.add('animate-shake');
            setTimeout(() => monsterZone.classList.remove('animate-shake'), 400);
            resetTilePosition();
        }

        function resetTilePosition() {
            activeTile.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            activeTile.style.transform = 'translate(0px, 0px) scale(1)';
            activeTile.style.zIndex = 1;
            activeTile.classList.remove('shadow-2xl', 'scale-110');
        }

        function submitScore() {
            const stuClass = document.getElementById('class-select').value;
            const stuNum = document.getElementById('student-num').value;
            
            if (!stuNum || stuNum < 1 || stuNum > 40) {
                alert("Please enter a valid Class Number (1-40)!");
                return;
            }

            if (window.persistHubUser) window.persistHubUser({ id: currentUser.id, lastName: currentUser.lastName, class: stuClass, studentNum: parseInt(stuNum, 10) });
            if (window.saveToFirebase && currentUser) {
                window.saveToFirebase({
                    class: stuClass,
                    studentNum: parseInt(stuNum),
                    lastName: currentUser.lastName,
                    googleId: currentUser.id,
                    score: wordsCompleted,
                    chapter: currentChapter
                });
            }
        }

        function setupEventListeners() {
            audioBtn.onclick = playAudio;
            monsterZone.onclick = playAudio;

            chapterSelect.onchange = (e) => {
                currentChapter = e.target.value;
                if (document.getElementById('filter-chapter')) {
                    document.getElementById('filter-chapter').value = currentChapter;
                }
                initGame();
            };

            modeBtn.onclick = () => {
                if (gameMode === 'infinite') {
                    if (!currentUser) {
                        alert("🔒 You must sign in with Google to play Timed Mode!");
                        return;
                    }
                    gameMode = 'timed';
                    modeBtn.textContent = '⏱️ Mode: Timed (3m)';
                } else {
                    gameMode = 'infinite';
                    modeBtn.textContent = '♾️ Mode: Infinite';
                }
                initGame();
            };

            hofBtn.onclick = () => {
                if (document.getElementById('filter-chapter')) {
                    document.getElementById('filter-chapter').value = currentChapter;
                }
                if (window.fetchLeaderboard) window.fetchLeaderboard();
                hofModal.classList.remove('hidden');
            };

            closeHofBtn.onclick = () => hofModal.classList.add('hidden');
            document.addEventListener('dragstart', (e) => e.preventDefault());
        }
    </script>
</body>
</html>
